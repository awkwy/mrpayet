<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 430" font-family="Segoe UI, Arial, Helvetica, sans-serif">
<rect width="680" height="430" fill="#e9edf3"/><rect x="30" y="10" width="360" height="410" fill="#fff" stroke="#8a97a8"/><text x="210" y="42" font-size="15" font-weight="bold" fill="#1f3864" text-anchor="middle" font-family="Arial">La mangrove de Mayotte et vous</text><text x="46" y="70" font-size="9.5" fill="#222" font-family="Arial">Bonjour, nous sommes élèves de TC APM au lycée de Kahani.</text><text x="46" y="83" font-size="9.5" fill="#222" font-family="Arial">Questionnaire anonyme, moins de 3 minutes. Merci !</text><text x="46" y="106" font-size="9.5" font-style="italic" fill="#222" font-family="Arial">Consigne : cochez une seule case par question.</text><text x="46" y="134" font-size="11" font-weight="bold" fill="#1f3864" font-family="Arial">Partie A — Qui êtes-vous ?</text><path d="M46 138 H374" stroke="#1f3864"/><text x="46" y="160" font-size="10" font-weight="bold" font-family="Arial">1. Vous êtes :</text><text x="60" y="178" font-size="10" font-family="Arial">☐ Une femme      ☐ Un homme</text><text x="46" y="204" font-size="10" font-weight="bold" font-family="Arial">2. Votre âge :</text><text x="60" y="222" font-size="10" font-family="Arial">☐ Moins de 18 ans   ☐ 18 à 30 ans   ☐ 31 à 50 ans   ☐ Plus de 50 ans</text><text x="46" y="254" font-size="11" font-weight="bold" fill="#1f3864" font-family="Arial">Partie B — La mangrove</text><path d="M46 258 H374" stroke="#1f3864"/><text x="46" y="280" font-size="10" font-weight="bold" font-family="Arial">3. Combien de fois êtes-vous allé près d'une mangrove cette année ?</text><text x="60" y="298" font-size="10" font-family="Arial">☐ 0    ☐ 1    ☐ 2    ☐ 3    ☐ 4 ou plus</text><text x="46" y="324" font-size="10" font-weight="bold" font-family="Arial">4. Selon vous, à quoi sert surtout la mangrove ?</text><text x="60" y="342" font-size="10" font-family="Arial">☐ Elle protège le littoral</text><text x="60" y="357" font-size="10" font-family="Arial">☐ Elle abrite des poissons et des crabes</text><text x="60" y="372" font-size="10" font-family="Arial">☐ Je ne sais pas</text><text x="210" y="408" font-size="11" font-weight="bold" text-anchor="middle" font-family="Arial">Merci d'avoir répondu à notre questionnaire !</text><path d="M392 38 L430 34" stroke="#d6281e" stroke-width="1.6" fill="none"/><circle cx="442" cy="34" r="11" fill="#d6281e" stroke="#fff" stroke-width="2"/><text x="442" y="39" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">1</text><text x="462" y="32" font-size="12.5" font-weight="bold" fill="#1b2a41">Titre</text><text x="462" y="47" font-size="11" fill="#444">Gras, taille 16, centré</text><path d="M392 72 L430 80" stroke="#d6281e" stroke-width="1.6" fill="none"/><circle cx="442" cy="80" r="11" fill="#d6281e" stroke="#fff" stroke-width="2"/><text x="442" y="85" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">2</text><text x="462" y="78" font-size="12.5" font-weight="bold" fill="#1b2a41">Introduction</text><text x="462" y="93" font-size="11" fill="#444">3 phrases : qui, pourquoi, anonyme</text><path d="M392 102 L430 126" stroke="#d6281e" stroke-width="1.6" fill="none"/><circle cx="442" cy="126" r="11" fill="#d6281e" stroke="#fff" stroke-width="2"/><text x="442" y="131" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">3</text><text x="462" y="124" font-size="12.5" font-weight="bold" fill="#1b2a41">Consigne</text><text x="462" y="139" font-size="11" fill="#444">En italique, courte</text><path d="M392 130 L430 172" stroke="#d6281e" stroke-width="1.6" fill="none"/><circle cx="442" cy="172" r="11" fill="#d6281e" stroke="#fff" stroke-width="2"/><text x="442" y="177" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">4</text><text x="462" y="170" font-size="12.5" font-weight="bold" fill="#1b2a41">Titres de parties</text><text x="462" y="185" font-size="11" fill="#444">Gras, ligne dessous</text><path d="M392 156 L430 218" stroke="#d6281e" stroke-width="1.6" fill="none"/><circle cx="442" cy="218" r="11" fill="#d6281e" stroke="#fff" stroke-width="2"/><text x="442" y="223" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">5</text><text x="462" y="216" font-size="12.5" font-weight="bold" fill="#1b2a41">Question</text><text x="462" y="231" font-size="11" fill="#444">En gras, numérotée</text><path d="M392 174 L430 264" stroke="#d6281e" stroke-width="1.6" fill="none"/><circle cx="442" cy="264" r="11" fill="#d6281e" stroke="#fff" stroke-width="2"/><text x="442" y="269" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">6</text><text x="462" y="262" font-size="12.5" font-weight="bold" fill="#1b2a41">Réponses</text><text x="462" y="277" font-size="11" fill="#444">Cases ☐ alignées, écriture normale</text><path d="M392 294 L430 320" stroke="#d6281e" stroke-width="1.6" fill="none"/><circle cx="442" cy="320" r="11" fill="#d6281e" stroke="#fff" stroke-width="2"/><text x="442" y="325" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">7</text><text x="462" y="318" font-size="12.5" font-weight="bold" fill="#1b2a41">Question chiffrée</text><text x="462" y="333" font-size="11" fill="#444">Nombres qui se suivent</text><path d="M392 404 L430 392" stroke="#d6281e" stroke-width="1.6" fill="none"/><circle cx="442" cy="392" r="11" fill="#d6281e" stroke="#fff" stroke-width="2"/><text x="442" y="397" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">8</text><text x="462" y="390" font-size="12.5" font-weight="bold" fill="#1b2a41">Merci</text><text x="462" y="405" font-size="11" fill="#444">Dernière ligne</text></svg>
