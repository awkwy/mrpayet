<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 260" font-family="Arial, Helvetica, sans-serif">
  <rect width="620" height="260" fill="#ffffff"/>
  <text x="20" y="26" font-size="16" font-weight="bold" fill="#111111">Trois trajectoires possibles</text>

  <!-- rectiligne : voiture sur route droite -->
  <g>
    <line x1="20" y1="90" x2="190" y2="90" stroke="#c0392b" stroke-width="2.4" stroke-dasharray="6 5"/>
    <circle cx="20" cy="90" r="4" fill="#c0392b"/>
    <rect x="150" y="76" width="40" height="18" rx="4" fill="none" stroke="#111111" stroke-width="2"/>
    <circle cx="160" cy="96" r="5" fill="none" stroke="#111111" stroke-width="1.6"/>
    <circle cx="182" cy="96" r="5" fill="none" stroke="#111111" stroke-width="1.6"/>
    <text x="105" y="118" text-anchor="middle" font-size="12.5" fill="#111111">rectiligne</text>
    <text x="105" y="134" text-anchor="middle" font-size="10.5" fill="#555555">(un piston, une voiture sur route droite)</text>
  </g>

  <!-- circulaire : roue sur banc -->
  <g transform="translate(310,90)">
    <circle cx="0" cy="0" r="45" fill="none" stroke="#111111" stroke-width="2.2"/>
    <circle cx="0" cy="0" r="6" fill="#111111"/>
    <circle cx="0" cy="-45" r="4.5" fill="#c0392b"/>
    <path d="M0,-45 A45,45 0 0 1 40,20" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="0" y="70" text-anchor="middle" font-size="12.5" fill="#111111">circulaire</text>
    <text x="0" y="86" text-anchor="middle" font-size="10.5" fill="#555555">(une valve, banc d'équilibrage)</text>
  </g>

  <!-- quelconque : cycloide valve qui avance -->
  <g transform="translate(430,90)">
    <path d="M0,0 C 10,-30 30,-30 40,0 C 50,30 70,30 80,0 C 90,-30 110,-30 120,0 C 130,30 150,30 160,0"
          fill="none" stroke="#c0392b" stroke-width="2.2"/>
    <circle cx="0" cy="0" r="4" fill="#c0392b"/>
    <circle cx="160" cy="0" r="4" fill="#c0392b"/>
    <line x1="-6" y1="35" x2="176" y2="35" stroke="#111111" stroke-width="1.6"/>
    <text x="85" y="60" text-anchor="middle" font-size="12.5" fill="#111111">quelconque</text>
    <text x="85" y="76" text-anchor="middle" font-size="10.5" fill="#555555">(la valve, véhicule qui avance)</text>
  </g>

  <text x="20" y="230" font-size="12" fill="#111111">Même roue, même valve : la forme de la trajectoire dépend du référentiel choisi pour l'observer.</text>
</svg>
