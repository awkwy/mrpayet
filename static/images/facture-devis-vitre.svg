<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 380" font-family="Arial, Helvetica, sans-serif">
  <rect width="420" height="380" fill="#ffffff"/>
  <text x="20" y="28" font-size="17" font-weight="bold" fill="#111111">La facture, une fois le devis accepté</text>

  <!-- feuille de facture -->
  <rect x="30" y="42" width="360" height="322" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>

  <!-- en-tete artisan -->
  <text x="50" y="68" font-size="13" font-weight="bold" fill="#111111">Vitrerie Artisan</text>
  <text x="50" y="85" font-size="11" fill="#111111">FACTURE n° 2026-014</text>
  <line x1="50" y1="98" x2="370" y2="98" stroke="#9a9a9a" stroke-width="1"/>

  <!-- lignes d'entete tableau -->
  <text x="50" y="120" font-size="12" font-weight="bold" fill="#111111">Prestation</text>
  <text x="370" y="120" text-anchor="end" font-size="12" font-weight="bold" fill="#111111">Montant HT</text>
  <line x1="50" y1="130" x2="370" y2="130" stroke="#111111" stroke-width="1.2"/>

  <!-- ligne 1 : vitre -->
  <text x="50" y="152" font-size="12" fill="#111111">Vitre standard</text>
  <text x="370" y="152" text-anchor="end" font-size="12" fill="#111111">180 €</text>

  <!-- ligne 2 : pose -->
  <text x="50" y="176" font-size="12" fill="#111111">Pose (main d'œuvre)</text>
  <text x="370" y="176" text-anchor="end" font-size="12" fill="#111111">70 €</text>

  <line x1="50" y1="192" x2="370" y2="192" stroke="#9a9a9a" stroke-width="1"/>

  <!-- sous-total HT -->
  <text x="50" y="214" font-size="12" fill="#111111">Total HT</text>
  <text x="370" y="214" text-anchor="end" font-size="12" fill="#111111">250 €</text>

  <!-- TVA -->
  <text x="50" y="236" font-size="12" fill="#111111">TVA (20 %)</text>
  <text x="370" y="236" text-anchor="end" font-size="12" fill="#111111">50 €</text>

  <line x1="50" y1="250" x2="370" y2="250" stroke="#111111" stroke-width="1.2"/>

  <!-- TOTAL TTC mis en avant -->
  <rect x="42" y="262" width="336" height="40" fill="#eeeeee" stroke="#111111" stroke-width="1.5"/>
  <text x="54" y="288" font-size="14" font-weight="bold" fill="#111111">TOTAL TTC</text>
  <text x="366" y="288" text-anchor="end" font-size="15" font-weight="bold" fill="#111111">300 €</text>

  <text x="50" y="326" font-size="11" fill="#111111">HT + TVA = TTC</text>
  <text x="50" y="344" font-size="11" fill="#111111">250 € + 50 € = 300 €</text>
</svg>
