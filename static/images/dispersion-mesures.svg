<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 230" font-family="Arial, Helvetica, sans-serif">
  <rect width="620" height="230" fill="#ffffff"/>
  <text x="20" y="26" font-size="16" font-weight="bold" fill="#111111">Cinq mesures de la même longueur</text>

  <!-- ligne graduee -->
  <line x1="60" y1="120" x2="560" y2="120" stroke="#111111" stroke-width="2"/>
  <g stroke="#111111" stroke-width="1.6">
    <line x1="60" y1="112" x2="60" y2="128"/>
    <line x1="160" y1="112" x2="160" y2="128"/>
    <line x1="260" y1="112" x2="260" y2="128"/>
    <line x1="360" y1="112" x2="360" y2="128"/>
    <line x1="460" y1="112" x2="460" y2="128"/>
    <line x1="560" y1="112" x2="560" y2="128"/>
  </g>
  <text x="60" y="150" text-anchor="middle" font-size="11.5" fill="#111111">1,18 m</text>
  <text x="160" y="150" text-anchor="middle" font-size="11.5" fill="#111111">1,19 m</text>
  <text x="260" y="150" text-anchor="middle" font-size="11.5" fill="#111111">1,20 m</text>
  <text x="360" y="150" text-anchor="middle" font-size="11.5" fill="#111111">1,21 m</text>
  <text x="460" y="150" text-anchor="middle" font-size="11.5" fill="#111111">1,22 m</text>
  <text x="560" y="150" text-anchor="middle" font-size="11.5" fill="#111111">1,23 m</text>

  <!-- cinq mesures placees -->
  <g fill="#c0392b">
    <circle cx="260" cy="90" r="6"/>
    <circle cx="460" cy="90" r="6"/>
    <circle cx="160" cy="90" r="6"/>
    <circle cx="360" cy="90" r="6"/>
    <circle cx="260" cy="70" r="6"/>
  </g>
  <text x="60" y="90" text-anchor="end" font-size="11" fill="#555555">5 mesures →</text>

  <!-- moyenne -->
  <line x1="292" y1="60" x2="292" y2="130" stroke="#1e6fb0" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="292" y="46" text-anchor="middle" font-size="12" fill="#1e6fb0" font-weight="bold">moyenne ≈ 1,20 m</text>

  <text x="20" y="195" font-size="12" fill="#111111">Cinq mesures de la même table, cinq points un peu différents : c'est la variabilité de la mesure.</text>
  <text x="20" y="213" font-size="12" fill="#111111">La moyenne (trait bleu) donne le résultat le plus fiable à retenir.</text>
</svg>
