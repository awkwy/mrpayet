<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" font-family="Arial, Helvetica, sans-serif">
  <rect width="640" height="280" fill="#ffffff"/>
  <text x="20" y="26" font-size="16" font-weight="bold" fill="#111111">Relevé GPS d'un essai routier</text>

  <!-- telephone / appli -->
  <g transform="translate(24,42)">
    <rect x="0" y="0" width="34" height="56" rx="6" fill="none" stroke="#111111" stroke-width="2"/>
    <line x1="6" y1="8" x2="28" y2="8" stroke="#111111" stroke-width="1.6"/>
    <circle cx="17" cy="46" r="2.4" fill="#111111"/>
    <path d="M17 16 C10 16 6 21 6 26 C6 32 17 40 17 40 C17 40 28 32 28 26 C28 21 24 16 17 16 Z" fill="#1e6fb0"/>
    <circle cx="17" cy="25" r="3.4" fill="#ffffff"/>
    <text x="17" y="70" text-anchor="middle" font-size="10.5" fill="#1e6fb0">appli GPS</text>
  </g>

  <!-- route -->
  <line x1="20" y1="180" x2="610" y2="180" stroke="#111111" stroke-width="2.4"/>

  <!-- fleches de tronçon, epaisseur proportionnelle a la vitesse -->
  <g stroke="#1e6fb0" fill="none" stroke-linecap="round">
    <line x1="20" y1="180" x2="45" y2="180" stroke-width="2.25"/>
    <line x1="45" y1="180" x2="244" y2="180" stroke-width="4.5"/>
    <line x1="244" y1="180" x2="544" y2="180" stroke-width="6"/>
    <line x1="544" y1="180" x2="610" y2="180" stroke-width="3"/>
  </g>
  <text x="32" y="200" text-anchor="middle" font-size="10.5" fill="#1e6fb0">5 m/s</text>
  <text x="144" y="200" text-anchor="middle" font-size="10.5" fill="#1e6fb0">20 m/s</text>
  <text x="394" y="200" text-anchor="middle" font-size="10.5" fill="#1e6fb0">30 m/s</text>
  <text x="577" y="200" text-anchor="middle" font-size="10.5" fill="#1e6fb0">10 m/s</text>

  <!-- points du releve, espaces selon la distance parcourue (echelle) -->
  <g>
    <circle cx="20" cy="180" r="6" fill="#ffffff" stroke="#111111" stroke-width="2.2"/>
    <text x="20" y="150" text-anchor="middle" font-size="12" font-weight="bold" fill="#111111">A</text>
    <text x="20" y="165" text-anchor="middle" font-size="10.5" fill="#555555">0 s</text>
    <text x="20" y="222" text-anchor="middle" font-size="10.5" fill="#555555">0 m</text>

    <circle cx="45" cy="180" r="6" fill="#ffffff" stroke="#111111" stroke-width="2.2"/>
    <text x="45" y="150" text-anchor="middle" font-size="12" font-weight="bold" fill="#111111">B</text>
    <text x="45" y="165" text-anchor="middle" font-size="10.5" fill="#555555">30 s</text>
    <text x="45" y="222" text-anchor="middle" font-size="10.5" fill="#555555">150 m</text>

    <circle cx="244" cy="180" r="6" fill="#ffffff" stroke="#111111" stroke-width="2.2"/>
    <text x="244" y="150" text-anchor="middle" font-size="12" font-weight="bold" fill="#111111">C</text>
    <text x="244" y="165" text-anchor="middle" font-size="10.5" fill="#555555">90 s</text>
    <text x="244" y="222" text-anchor="middle" font-size="10.5" fill="#555555">1350 m</text>

    <circle cx="544" cy="180" r="6" fill="#ffffff" stroke="#111111" stroke-width="2.2"/>
    <text x="544" y="150" text-anchor="middle" font-size="12" font-weight="bold" fill="#111111">D</text>
    <text x="544" y="165" text-anchor="middle" font-size="10.5" fill="#555555">150 s</text>
    <text x="544" y="222" text-anchor="middle" font-size="10.5" fill="#555555">3150 m</text>

    <circle cx="610" cy="180" r="6" fill="#ffffff" stroke="#111111" stroke-width="2.2"/>
    <text x="610" y="150" text-anchor="middle" font-size="12" font-weight="bold" fill="#111111">E</text>
    <text x="596" y="165" text-anchor="middle" font-size="10.5" fill="#555555">190 s</text>
    <text x="606" y="222" text-anchor="middle" font-size="10.5" fill="#555555">3550 m</text>
  </g>

  <text x="20" y="252" font-size="11.5" fill="#555555">Chaque point : l'heure et la distance totale parcourue depuis le départ. Flèche plus épaisse = tronçon plus rapide.</text>
</svg>
