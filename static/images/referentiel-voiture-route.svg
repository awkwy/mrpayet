<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 260" font-family="Arial, Helvetica, sans-serif">
  <rect width="620" height="260" fill="#ffffff"/>
  <text x="20" y="28" font-size="17" font-weight="bold" fill="#111111">Un même point, deux référentiels</text>

  <!-- route -->
  <line x1="10" y1="210" x2="610" y2="210" stroke="#111111" stroke-width="2.4"/>
  <line x1="30" y1="210" x2="60" y2="210" stroke="#111111" stroke-width="4"/>
  <line x1="100" y1="210" x2="130" y2="210" stroke="#111111" stroke-width="4"/>
  <line x1="170" y1="210" x2="200" y2="210" stroke="#111111" stroke-width="4"/>

  <!-- poteau (repère fixe au sol) -->
  <line x1="80" y1="150" x2="80" y2="210" stroke="#c0392b" stroke-width="3"/>
  <circle cx="80" cy="146" r="5" fill="#c0392b"/>
  <text x="80" y="232" text-anchor="middle" font-size="12" fill="#c0392b">poteau (référentiel Terre)</text>

  <!-- voiture -->
  <g transform="translate(330,120)">
    <rect x="0" y="20" width="180" height="45" rx="10" fill="none" stroke="#111111" stroke-width="2.4"/>
    <path d="M20 20 L45 -10 L135 -10 L160 20 Z" fill="none" stroke="#111111" stroke-width="2.4"/>
    <circle cx="35" cy="65" r="14" fill="none" stroke="#111111" stroke-width="2.4"/>
    <circle cx="145" cy="65" r="14" fill="none" stroke="#111111" stroke-width="2.4"/>
    <!-- retroviseur = système observé -->
    <rect x="52" y="-4" width="14" height="7" fill="#1e7d34"/>
    <circle cx="59" cy="0" r="4" fill="none" stroke="#1e7d34" stroke-width="1.6"/>
    <text x="59" y="-14" text-anchor="middle" font-size="11" fill="#1e7d34" font-weight="bold">rétroviseur</text>
  </g>

  <!-- fleche vitesse -->
  <path d="M330 205 L280 205" stroke="#111111" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="305" y="196" text-anchor="middle" font-size="12" fill="#111111">90 km/h</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#111111"/>
    </marker>
  </defs>

  <text x="310" y="232" text-anchor="middle" font-size="12" fill="#1e7d34">référentiel voiture : le rétroviseur ne bouge pas</text>
  <text x="310" y="248" text-anchor="middle" font-size="11.5" fill="#111111">référentiel Terre (vu du poteau) : le rétroviseur avance à 90 km/h</text>
</svg>
